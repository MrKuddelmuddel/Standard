[project]
name = "nexus-quant"
version = "0.1.0"
description = "NEXUS QUANT: crypto backtesting, discovery, journal and paper trading (MVP)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "F811", "F401"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.pycodestyle]
max-line-length = 170
