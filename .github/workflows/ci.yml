name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,ai]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app quant
      - name: Tests
        run: pytest -o addopts=""
      - name: Migrations on PostgreSQL (upgrade, drift check, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://nexus:nexus@localhost:5432/nexus
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Legacy lab tests
        working-directory: legacy/backtest-lab
        run: |
          pip install "numpy>=1.26" "pandas>=2.1"
          python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e "./backend"
          (cd frontend && npm ci && npm run build)
          npm install --no-save --prefix e2e playwright@1
          npx --prefix e2e playwright install --with-deps chromium
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start stack
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
          JOBS_MODE: thread
        run: |
          (cd backend && nohup uvicorn app.main:app --port 8000 > ${{ runner.temp }}/api.log 2>&1 &)
          (cd frontend && nohup npx next start -p 3000 > ${{ runner.temp }}/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/health && curl -sf -o /dev/null localhost:3000/login && exit 0; sleep 1; done
          cat ${{ runner.temp }}/api.log ${{ runner.temp }}/web.log; exit 1
      - name: Run workflow
        run: NODE_PATH=e2e/node_modules node e2e/workflow.mjs "${{ runner.temp }}"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
